<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoicism: philosophy for modern resilience | interactive presentation</title>
    <meta name="description" content="The former standalone Stoicism presentation is now served by the maintained, self-contained interactive presentation.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#f1ede5">
    <link rel="canonical" href="https://mariuscomper.github.io/stoicism-presentation/">
    <meta http-equiv="refresh" content="0; url=./index.html">
   <style>
        :root {
            color-scheme: light dark;
            --compat-bg: #f1ede5;
            --compat-surface: #fffdf8;
            --compat-text: #20282d;
            --compat-accent: #8a5e35;
            --compat-link: #6b4525;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--compat-bg); color: var(--compat-text); }
        main { max-width: 42rem; margin: 2rem; padding: 2rem; background: var(--compat-surface); border: 2px solid var(--compat-accent); border-radius: 0.75rem; }
        a { color: var(--compat-link); font-weight: 700; }
       @media (prefers-color-scheme: dark) {
            :root {
                --compat-bg: #1a1a1a;
                --compat-surface: #2b2b2b;
                --compat-text: #e0dcd7;
                --compat-accent: #c49a6c;
                --compat-link: #c49a6c;
            }
       }
    </style>
</head>
<body>
    <main>
        <h1>Stoicism: philosophy for modern resilience</h1>
        <p>This older presentation URL now points to the maintained self-contained version.</p>

    </main>
