<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoicism: philosophy for modern resilience | interactive presentation</title>
    <meta name="description" content="An interactive 19-slide presentation on Stoic philosophy, practical resilience, virtue, and modern applications.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="color-scheme" content="light dark">
    <link rel="canonical" href="https://mariuscomper.github.io/stoicism-presentation/">
    <meta property="og:title" content="Stoicism: philosophy for modern resilience">
    <meta property="og:description" content="An interactive 19-slide presentation on Stoic philosophy, practical resilience, virtue, and modern applications.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mariuscomper.github.io/stoicism-presentation/">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #C49A6C;
            --secondary: #5C6D67;
            --bg: #2B2B2B;
            --text: #E0DCD7;
            --accent: #A8A39D;
            --dark-bg: #1a1a1a;
            --card-bg: rgba(58, 58, 58, 0.4);
            --quote-bg: rgba(196, 154, 108, 0.1);
            --accent-surface: rgba(196, 154, 108, 0.1);
            --deep-surface: rgba(43, 43, 43, 0.6);
            --timeline-surface: rgba(58, 58, 58, 0.4);
            --icon-on-primary: #2B2B2B;
            --icon-on-secondary: #ffffff;
            --overview-bg: rgba(0, 0, 0, 0.95);
            --cover-bg: #1a1a1a;
            --slide-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --primary: #8a5e35;
            --secondary: #45645d;
            --bg: #fffdf8;
            --text: #20282d;
            --accent: #4e5b5e;
            --dark-bg: #f1ede5;
            --card-bg: #ffffff;
            --quote-bg: rgba(138, 94, 53, 0.1);
            --accent-surface: rgba(138, 94, 53, 0.1);
            --deep-surface: #e8e1d7;
            --timeline-surface: #f5f1e8;
            --icon-on-primary: #ffffff;
            --icon-on-secondary: #ffffff;
            --overview-bg: rgba(18, 24, 25, 0.94);
            --cover-bg: #fffdf8;
            --slide-shadow: 0 10px 50px rgba(34, 31, 26, 0.16);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--dark-bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .font-display {
            font-family: Georgia, "Times New Roman", serif;
        }

        .font-heading {
            font-family: Georgia, "Times New Roman", serif;
        }

        /* Main Container */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            background: var(--bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .slide-counter {
            color: var(--accent);
            font-size: 0.9rem;
            min-width: 80px;
            text-align: center;
        }

        /* Slide Container */
        .slide-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .slide {
            position: absolute;
            width: 100%;
            max-width: 1200px;
            height: calc(100% - 4rem);
            background: var(--bg);
            border-radius: 12px;
            padding: 3rem;
            box-shadow: var(--slide-shadow);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
            z-index: 10;
        }

        .slide.prev {
            opacity: 0;
            transform: translateX(-100%);
        }

        /* Slide Styles */
        .slide h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .slide h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .slide h3 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }

        .slide h4 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .slide p {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .divider {
            height: 3px;
            width: 100px;
            background: var(--primary);
            margin: 1rem 0;
        }

        /* Cover Slide */
        .slide.cover {
            background: linear-gradient(135deg, var(--bg) 0%, var(--cover-bg) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }

        .slide.cover h1 {
            font-size: 5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slide.cover .subtitle {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .slide.cover .tagline {
            font-size: 1.5rem;
            color: var(--accent);
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(196, 154, 108, 0.2);
            border: 2px solid var(--primary);
            color: var(--text);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 50;
        }

        .nav-arrow:hover {
            background: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-arrow.left {
            left: 2rem;
        }

        .nav-arrow.right {
            right: 2rem;
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-arrow:disabled:hover {
            background: rgba(196, 154, 108, 0.2);
            transform: translateY(-50%);
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(196, 154, 108, 0.2);
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .card.secondary {
            border-left-color: var(--secondary);
        }

        .card.tone-primary {
            border-left-color: var(--primary);
        }

        .card.tone-secondary {
            border-left-color: var(--secondary);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: var(--icon-on-primary);
        }

        .card-icon.secondary {
            background: var(--secondary);
            color: var(--icon-on-secondary);
        }

        .card-icon.tone-primary {
            background: var(--primary);
        }

        .card-icon.tone-secondary {
            background: var(--secondary);
            color: var(--icon-on-secondary);
        }

        .card-icon.tone-primary .card-icon-number {
            color: var(--icon-on-primary);
        }

        .card-icon.tone-secondary .card-icon-number {
            color: var(--icon-on-secondary);
        }

        .accent-surface {
            background: var(--accent-surface);
        }

        .deep-surface {
            background: var(--deep-surface);
        }

        .timeline-entry {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--timeline-surface);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .timeline-entry.tone-secondary {
            border-left-color: var(--secondary);
        }

        /* Quote Boxes */
        .quote {
            background: var(--quote-bg);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            border-radius: 4px;
        }

        .quote-author {
            margin-top: 1rem;
            color: var(--primary);
            font-weight: bold;
        }

        /* Lists */
        ul, ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 0.75rem 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .slide {
                padding: 1.5rem;
            }

            .slide h1 {
                font-size: 2.5rem;
            }

            .slide h2 {
                font-size: 1.8rem;
            }

            .slide.cover h1 {
                font-size: 3rem;
            }

            .nav-arrow {
                width: 40px;
                height: 40px;
            }

            .nav-arrow.left {
                left: 1rem;
            }

            .nav-arrow.right {
                right: 1rem;
            }

            .btn span {
                display: none;
            }
        }

        /* Overview/Thumbnail Mode */
        .overview-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overview-bg);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .overview-mode.active {
            display: block;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .overview-slide {
            background: var(--bg);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .overview-slide:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .overview-slide.current {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(196, 154, 108, 0.5);
        }

        .overview-number {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .overview-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .overview-close {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1001;
        }

        /* Fullscreen styles */
        .fullscreen-active header {
            display: none;
        }

        .fullscreen-active .slide-container {
            padding: 0;
        }

        .fullscreen-active .slide {
            max-width: 100%;
            height: 100%;
            border-radius: 0;
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 3px solid rgba(196, 154, 108, 0.3);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-title {
            color: var(--primary);
            font-size: 1.5rem;
        }

        .theme-toggle {
            min-width: 118px;
        }

        .noscript-note {
            margin: 2rem;
            padding: 1rem;
            background: var(--card-bg);
            color: var(--text);
            border-left: 4px solid var(--primary);
        }

        .nav-arrow i,
        .btn i {
            font-style: normal;
            font-family: inherit;
        }

        .nav-arrow.left i::before { content: '←'; }
        .nav-arrow.right i::before { content: '→'; }
        #overview-btn i::before { content: '▦'; }
        #fullscreen-btn i::before { content: '⛶'; }
        #autoplay-btn i::before { content: '▶'; }
        #overview-close i::before { content: '×'; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="logo font-display">Stoicism</div>
            <div class="controls">
                <div class="slide-counter">
                    <span id="current-slide">1</span> / <span id="total-slides">19</span>
                </div>
                <button class="btn theme-toggle" id="themeToggle" type="button" data-theme-storage="stoicism-presentation" aria-label="Change colour theme" aria-pressed="false">Dark theme</button>
                <button class="btn" id="overview-btn" title="Overview (Esc)">
                    <i class="fas fa-th"></i>
                    <span>Overview</span>
                </button>
                <button class="btn" id="fullscreen-btn" title="Fullscreen (F)">
                    <i class="fas fa-expand"></i>
                    <span>Fullscreen</span>
                </button>
                <button class="btn" id="autoplay-btn" title="Auto-play (A)">
                    <i class="fas fa-play"></i>
                    <span>Auto-play</span>
                </button>
            </div>
        </header>

        <div class="slide-container" id="slide-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading presentation...</p>
            </div>

            <button class="nav-arrow left" id="prev-btn" title="Previous (←)" aria-label="Previous slide">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="nav-arrow right" id="next-btn" title="Next (→)" aria-label="Next slide">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="overview-mode" id="overview-mode">
            <button class="btn overview-close" id="overview-close" aria-label="Close overview">
                <i class="fas fa-times"></i> Close
            </button>
            <div class="overview-grid" id="overview-grid"></div>
        </div>
    </div>

    <noscript>
        <p class="noscript-note">JavaScript is required to load the 19-slide presentation from its local data file. Enable JavaScript and reload this page.</p>
    </noscript>
    <script src="theme-toggle.js"></script>
    <script src="app.js"></script>
</body>
</html>
